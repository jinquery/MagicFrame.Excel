name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore MagicFrame.Excel.sln

      - name: Build
        run: dotnet build MagicFrame.Excel.sln -c Release --no-restore

      - name: Test
        run: dotnet test MagicFrame.Excel.sln -c Release --no-build --logger "console;verbosity=minimal"

      - name: Smoke stress test (5000 x 30)
        run: dotnet run --project tools/MagicFrame.Excel.StressTest --no-build -- 5000 30 1

  pack:
    needs: build-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Pack
        run: dotnet pack MagicFrame.Excel.csproj -c Release -o artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
